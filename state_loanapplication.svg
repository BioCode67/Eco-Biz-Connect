<text x="710" y="242" text-anchor="middle" font-size="10" fill="#a0612a">webhook</text>
<text x="710" y="255" text-anchor="middle" font-size="10" fill="#a0612a">[rejected]</text>
<circle cx="915" cy="410" r="12" fill="#ffffff" stroke="#3f4f63" stroke-width="1.8"/><circle cx="915" cy="410" r="6" fill="#3f4f63"/>
<path d="M915,350 L915,398" fill="none" stroke="#3f4f63" stroke-width="1.5" marker-end="url(#sarr)"/>
<circle cx="595" cy="410" r="12" fill="#ffffff" stroke="#3f4f63" stroke-width="1.8"/><circle cx="595" cy="410" r="6" fill="#3f4f63"/>
<path d="M595,350 L595,398" fill="none" stroke="#3f4f63" stroke-width="1.5" marker-end="url(#sarr)"/>
<path d="M552.0,110 C544.0,74 596.0,74 588.0,108" fill="none" stroke="#3f4f63" stroke-width="1.4" marker-end="url(#sarr)"/>
<rect x="482.8" y="68" width="174.4" height="13" fill="#ffffff" opacity="0.88" rx="2"/>
<text x="570.0" y="78" text-anchor="middle" font-size="9.5" fill="#a0612a">Bank unreachable / enqueue retry</text>
<path d="M490,158 Q415,190 340,158" fill="none" stroke="#3f4f63" stroke-width="1.5" marker-end="url(#sarr)"/>
<rect x="367.8" y="193" width="94.4" height="17" fill="#ffffff" opacity="0.88" rx="2"/>
<text x="415" y="204" text-anchor="middle" font-size="10" fill="#a0612a">validation error</text>
</svg>