<line x1="820" y1="140" x2="1020" y2="140" stroke="#3a9d5d" stroke-width="1.1"/>
<text x="832" y="156" font-size="10.5" fill="#3a4654">entry / save REVIEW</text>
<text x="832" y="172" font-size="10.5" fill="#3a4654">do / await webhook</text>
