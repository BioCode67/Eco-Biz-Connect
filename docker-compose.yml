# Eco-Biz Connect — 개발용 인프라.
# Phase 0: PostgreSQL 만 컨테이너로 띄운다. backend 는 로컬(uvicorn) 실행 전제.
# 환경변수는 루트의 .env 를 참조한다 (backend/.env.example 참고).

services:
  db:
    image: postgres:16
    container_name: ebc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebc}
      POSTGRES_DB: ${POSTGRES_DB:-ebc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebc} -d ${POSTGRES_DB:-ebc}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
